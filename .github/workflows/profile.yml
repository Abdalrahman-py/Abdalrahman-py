name: Profile analytics

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate.mjs", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # PROFILE_TOKEN is optional: a scope-less PAT adds private-repo contributions. Falls back to the built-in token.
      - name: Generate SVGs
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile assets" && git push)
